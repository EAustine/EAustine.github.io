<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared with Matte</title>
<meta name="description" content="An image shared from Matte.">
<meta name="theme-color" content="#cbcbd1">
<meta name="robots" content="noindex">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#cbcbd1;
    --card:#ffffff;
    --ink:#17171a;
    --muted:#63636b;
    --track:#f2f2f5;
    --shadow:0 1px 2px rgba(20,20,30,.10),0 10px 32px rgba(20,20,30,.16);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--stage);color:var(--ink);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
  .mark{display:block;height:19px;width:auto}
  header a{color:var(--muted);text-decoration:none;font-size:12.5px}
  header a:hover{color:var(--ink)}

  main{flex:1;display:grid;place-items:center;padding:8px 20px 24px;min-height:0}
  figure{margin:0;display:grid;place-items:center;gap:20px;max-width:100%;max-height:100%}
  img.shot{
    display:block;max-width:100%;max-height:60vh;width:auto;height:auto;
    border-radius:3px;box-shadow:0 2px 6px rgba(20,20,30,.14),0 18px 48px rgba(20,20,30,.18);
    background:var(--card);
  }

  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{
    appearance:none;font:inherit;font-size:14px;font-weight:500;padding:11px 20px;
    border:1px solid transparent;border-radius:9px;background:var(--ink);color:#fff;
    cursor:pointer;text-decoration:none;box-shadow:var(--shadow);
  }
  .btn:hover{background:#000}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn.ghost:hover{background:var(--track)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .state{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:36px 30px;text-align:center;max-width:min(460px,calc(100vw - 40px));
  }
  .state h1{margin:0 0 10px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .state p{margin:0 0 4px;font-size:14px;line-height:1.55;color:var(--muted)}
  .state .btn{margin-top:18px;display:inline-block}

  footer{padding:0 20px 22px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--ink)}

  @media (max-width:720px){
    header{padding:13px 14px}
    img.shot{max-height:52vh}
  }
</style>
</head>
<body>

<header>
  <a href="./" aria-label="Matte"><img class="mark" src="wordmark.svg" alt="Matte"></a>
  <a href="./">Make your own</a>
</header>

<main>
  <figure id="frame" hidden>
    <img class="shot" id="shot" alt="A shared image">
    <div class="actions">
      <a class="btn" id="download" download>Download</a>
      <a class="btn ghost" href="./">Open Matte</a>
    </div>
  </figure>

  <div class="state" id="state">
    <h1 id="stateTitle">Loading…</h1>
    <p id="stateText">Fetching the shared image.</p>
    <a class="btn" id="stateAction" href="./" hidden>Open Matte</a>
  </div>
</main>

<footer>Shared from <a href="./">Matte</a>. Images are held as uploaded and are not edited here.</footer>

<script>
(function () {
  'use strict';

  var PROJECT = 'https://tmaukbgdkkqcbwqgrmje.supabase.co';
  var BUCKET = 'matte-shares';

  var el = {
    frame: document.getElementById('frame'),
    shot: document.getElementById('shot'),
    download: document.getElementById('download'),
    state: document.getElementById('state'),
    title: document.getElementById('stateTitle'),
    text: document.getElementById('stateText'),
    action: document.getElementById('stateAction')
  };

  function fail(title, text) {
    el.frame.hidden = true;
    el.state.hidden = false;
    el.title.textContent = title;
    el.text.textContent = text;
    el.action.hidden = false;
  }

  var name = new URLSearchParams(location.search).get('i') || '';

  // The name comes off the URL, so it is checked against the exact shape this
  // app generates before being put into a path. Anything else is not a link
  // Matte made.
  if (!/^[a-f0-9]{32}\.png$/.test(name)) {
    fail('That link is not complete',
         'It may have been cut short when it was pasted. Ask for the whole link, or make your own image.');
    return;
  }

  var url = PROJECT + '/storage/v1/object/public/' + BUCKET + '/' + name;

  // Supabase sets Content-Disposition when ?download is present, so the button
  // is a plain link and never has to fetch the file across origins.
  el.download.href = url + '?download=matte.png';

  el.shot.onload = function () {
    el.state.hidden = true;
    el.frame.hidden = false;
  };
  el.shot.onerror = function () {
    fail('This image is not here',
         'The link may be wrong, or the image may have been removed.');
  };
  el.shot.src = url;
})();
</script>
</body>
</html>
